services:
  - type: web
    name: brandguard-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: CLIENT_URL
        value: https://your-app.vercel.app,http://localhost:5173
